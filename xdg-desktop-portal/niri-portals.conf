# Порталы только для сессии niri (KDE читает свой kde-portals.conf).
# Отличие от системного /usr/share/xdg-desktop-portal/niri-portals.conf:
# пароли (Secret) берутся из KWallet, как в KDE, а не из gnome-keyring.
# Иначе Chrome и другие программы в niri и в KDE видят разные хранилища.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=kwallet;
