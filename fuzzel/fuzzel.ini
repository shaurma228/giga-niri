# Spotlight giga-niri в стиле macOS 27: широкая стеклянная строка в верхней
# трети экрана. Открывается по Mod+D и значку лупы в строке меню.
# Блюр и тень под ним даёт niri (layer-rule для namespace "launcher").

[main]
namespace=launcher
font=Inter:size=15,JetBrainsMono Nerd Font:size=15
icon-theme=McMojave-circle
terminal=alacritty --config-file /home/goydaslav/.config/giga-niri/alacritty.toml -e
prompt="󰍉  "
placeholder=Поиск Spotlight
layer=overlay
anchor=top
y-margin=210
width=46
lines=8
horizontal-pad=18
vertical-pad=16
inner-pad=12
line-height=40
image-size-ratio=0
match-mode=fuzzy
exit-on-keyboard-focus-loss=yes

[colors]
background=1e1e20cc
text=d1d1d6ff
prompt=aeaeb2ff
placeholder=8e8e93ff
input=f2f2f7ff
match=ffffffff
selection=0a84ffff
selection-text=ffffffff
selection-match=ffffffff
counter=8e8e93ff
border=ffffff30

[border]
width=1
radius=26
selection-radius=12

# Spotlight (Mod+D), подсказка (Mod+Shift+/) и меню питания (Mod+Shift+Q)
# закрываются тем же сочетанием, что открыли, — если fuzzel держит клавиатуру
# и niri не получает нажатие. Mod4 = Super; Cyrillic_ve — клавиша D в русской раскладке.
[key-bindings]
cancel=Control+g Control+c Control+bracketleft Escape Mod4+d Mod4+Cyrillic_ve Mod4+question Mod4+comma Mod4+Shift+q Mod4+Shift+Cyrillic_shorti
