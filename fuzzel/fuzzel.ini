# Лаунчер giga-niri (Tokyo Glass). Открывается по Mod+D.
# Блюр под ним даёт niri (layer-rule для namespace "launcher").

[main]
namespace=launcher
font=Inter:size=13:weight=semibold,JetBrainsMono Nerd Font:size=13
icon-theme=McMojave-circle
terminal=alacritty --config-file /home/goydaslav/.config/giga-niri/alacritty.toml -e
prompt="󰍉  "
placeholder=Поиск приложений
layer=overlay
anchor=center
width=40
lines=7
horizontal-pad=20
vertical-pad=18
inner-pad=14
line-height=38
image-size-ratio=0
match-mode=fuzzy
exit-on-keyboard-focus-loss=yes

[colors]
background=1a1b26b8
text=a9b1d6ff
prompt=7aa2f7ff
placeholder=565f89ff
input=c0caf5ff
match=bb9af7ff
selection=7aa2f747
selection-text=c0caf5ff
selection-match=bb9af7ff
counter=565f89ff
border=7aa2f7cc

[border]
width=2
radius=24
selection-radius=14
