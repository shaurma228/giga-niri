# Экран блокировки giga-niri (Tokyo Glass).
# Запуск: hyprlock -c ~/.config/giga-niri/hyprlock.conf (Super+Alt+L, меню питания, hypridle)

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Размытые обои вместо снимка экрана: содержимое окон не видно
background {
    monitor =
    path = ~/.config/giga-niri/wallpaper.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.65
    vibrancy = 0.2
}

# Часы
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    font_family = Inter ExtraBold
    font_size = 112
    color = rgba(c0caf5ff)
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(16161eaa)
    position = 0, 190
    halign = center
    valign = center
}

# Дата по-русски
label {
    monitor =
    text = cmd[update:60000] LC_TIME=ru_RU.UTF-8 date +"%A, %-d %B"
    font_family = Inter SemiBold
    font_size = 20
    color = rgba(bb9af7ff)
    position = 0, 85
    halign = center
    valign = center
}

# Поле пароля: стекло с градиентной рамкой, как у окон
input-field {
    monitor =
    size = 360, 56
    rounding = 18
    outline_thickness = 2
    outer_color = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    inner_color = rgba(1a1b26b8)
    font_color = rgba(c0caf5ff)
    font_family = Inter
    dots_size = 0.22
    dots_spacing = 0.35
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">Пароль</span>
    check_color = rgba(e0af68ee) rgba(ff9e64ee) 45deg
    fail_color = rgba(f7768eee)
    fail_text = Неверный пароль
    capslock_color = rgba(ff9e64ee)
    position = 0, -40
    halign = center
    valign = center
}

# Раскладка: напоминание, что пароль набирается в текущей раскладке
label {
    monitor =
    text = $LAYOUT
    font_family = JetBrainsMono Nerd Font
    font_size = 12
    color = rgba(565f89ff)
    position = 0, -100
    halign = center
    valign = center
}
