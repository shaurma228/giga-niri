# Экран блокировки giga-niri в стиле macOS 27: сверху дата и крупные часы,
# снизу имя пользователя и поле пароля-«пилюля».
# Запуск: hyprlock -c ~/.config/giga-niri/hyprlock.conf (Super+Alt+L, меню, hypridle)

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Размытые обои вместо снимка экрана: содержимое окон не видно
background {
    monitor =
    path = ~/.config/giga-niri/wallpaper.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.8
    vibrancy = 0.15
}

# Дата
label {
    monitor =
    text = cmd[update:60000] s=$(LC_TIME=ru_RU.UTF-8 date +"%A, %-d %B"); echo "${s^}"
    font_family = Inter SemiBold
    font_size = 22
    color = rgba(f2f2f7e6)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0000004d)
    position = 0, -80
    halign = center
    valign = top
}

# Часы
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    font_family = Inter Bold
    font_size = 120
    color = rgba(ffffffee)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000059)
    position = 0, -120
    halign = center
    valign = top
}

# Имя пользователя
label {
    monitor =
    text = $USER
    font_family = Inter SemiBold
    font_size = 15
    color = rgba(ffffffee)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000066)
    position = 0, 150
    halign = center
    valign = bottom
}

# Поле пароля: стеклянная «пилюля» без рамки
input-field {
    monitor =
    size = 240, 38
    rounding = -1
    outline_thickness = 0
    inner_color = rgba(ffffff38)
    font_color = rgba(ffffffff)
    font_family = Inter
    dots_size = 0.2
    dots_spacing = 0.35
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffb3">Введите пароль</span>
    check_color = rgba(ffffff59)
    fail_color = rgba(ff453acc)
    fail_text = Неверный пароль
    capslock_color = rgba(ff9f0acc)
    position = 0, 100
    halign = center
    valign = bottom
}

# Раскладка: пароль набирается в текущей раскладке
label {
    monitor =
    text = $LAYOUT
    font_family = Inter
    font_size = 11
    color = rgba(ffffff99)
    position = 0, 72
    halign = center
    valign = bottom
}
