# Простой и сон в niri. Запускается из автозапуска niri:
# hypridle -c ~/.config/giga-niri/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/giga-niri/hyprlock.conf
    # Перед сном (крышка, меню питания) экран блокируется
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors
}

# 5 минут: приглушить подсветку встроенного экрана
listener {
    timeout = 300
    on-timeout = brightnessctl --class=backlight -s set 30%
    on-resume = brightnessctl --class=backlight -r
}

# 10 минут: заблокировать
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 минут: выключить мониторы
listener {
    timeout = 660
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}
