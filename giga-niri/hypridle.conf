# Простой и сон в niri, как в KDE (powerdevilrc, kscreenlockerrc).
# Запускается из автозапуска niri: hypridle -c ~/.config/giga-niri/hypridle.conf
#
# На зарядке ничего не происходит: экран не гаснет, ноутбук не спит.
# Решения по питанию принимает giga-niri/idle.sh (см. таблицу в нём).
# Автоблокировки нет (в KDE Autolock=false), но экран блокируется перед сном.

general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/giga-niri/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/giga-niri/idle.sh screen-on
}

# Низкий заряд: 2 мин — приглушить
listener {
    timeout = 120
    on-timeout = ~/.config/giga-niri/idle.sh dim low
    on-resume = ~/.config/giga-niri/idle.sh undim
}

# Низкий заряд: 5 мин — выключить экран
listener {
    timeout = 300
    on-timeout = ~/.config/giga-niri/idle.sh screen-off low
    on-resume = ~/.config/giga-niri/idle.sh screen-on
}

# От батареи: 10 мин — приглушить; низкий заряд: 10 мин — сон
listener {
    timeout = 600
    on-timeout = ~/.config/giga-niri/idle.sh dim battery; ~/.config/giga-niri/idle.sh suspend low
    on-resume = ~/.config/giga-niri/idle.sh undim
}

# От батареи: 30 мин — выключить экран
listener {
    timeout = 1800
    on-timeout = ~/.config/giga-niri/idle.sh screen-off battery
    on-resume = ~/.config/giga-niri/idle.sh screen-on
}
