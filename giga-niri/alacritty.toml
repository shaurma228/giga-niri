# Alacritty внутри niri. Берёт ваш обычный конфиг и переопределяет поверх него
# только то, что нужно оформлению. Сам ~/.config/alacritty не меняется.
# Цвета — системная палитра macOS для тёмного режима.

[general]
import = ["~/.config/alacritty/alacritty.toml"]

[window]
# Полупрозрачный фон: под ним блюр niri (стекло, как Terminal в macOS)
opacity = 0.78
padding = { x = 16, y = 14 }
decorations = "None"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

[colors]
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#1c1c1e"
foreground = "#f2f2f7"

[colors.cursor]
text = "#1c1c1e"
cursor = "#0a84ff"

[colors.selection]
text = "CellForeground"
background = "#1f4f8f"

[colors.normal]
black = "#1c1c1e"
red = "#ff453a"
green = "#32d74b"
yellow = "#ffd60a"
blue = "#0a84ff"
magenta = "#bf5af2"
cyan = "#64d2ff"
white = "#d1d1d6"

[colors.bright]
black = "#636366"
red = "#ff6961"
green = "#4ae16a"
yellow = "#ffe050"
blue = "#409cff"
magenta = "#da8fff"
cyan = "#8ae1ff"
white = "#f2f2f7"
